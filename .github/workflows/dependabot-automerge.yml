name: Dependabot Auto-merge

# ──────────────────────────────────────────────────────────────────────────────
# Dependabot PR 自动 squash 合并，目标是仓库里长期只剩 main 一个分支。
#
#   - github-actions PR（含 major）：直接合并。
#   - web/ 的 npm PR：先 npm ci + astro check + astro build（用 web/fixtures/packages.json，
#     不访问 Releases API），全部通过才合并；major 已在 dependabot.yml 里忽略。
#
# 注意事项：
#   - 仓库没有分支保护 / required checks，所以直接 `gh pr merge`，不用 --auto
#     （--auto 需要开启 "Allow auto-merge" 且存在待完成的检查）。
#   - Dependabot 触发的 run 读不到普通 Actions secrets，只能读 Dependabot secrets。
#   - GITHUB_TOKEN 无法获得 `workflows` 权限。合并修改 .github/workflows/* 的 PR 时，
#     GitHub 可能以 "refusing to allow a GitHub App to create or update workflow ...
#     without `workflows` permission" 拒绝。稳妥做法：在 Settings → Secrets → Dependabot
#     添加 DEPENDABOT_AUTOMERGE_TOKEN（fine-grained PAT：Contents / Pull requests /
#     Workflows 读写）。有它就用它合并，否则回退 GITHUB_TOKEN；合并失败时 job 报错并提示。
#   - GITHUB_TOKEN 合并产生的 push 不会触发其他 workflow，所以 npm PR 合并后要手动
#     dispatch update-index.yml 重新部署 Pages（workflow_dispatch 不受此限制）。
#     用 PAT 合并时 push 会正常触发 update-index.yml（paths: web/**），不再重复 dispatch。
# ──────────────────────────────────────────────────────────────────────────────
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write # gh workflow run update-index.yml
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      HAS_PAT: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN != '' }}
    steps:
      # 同时校验 PR 提交确实来自 Dependabot（人工 push 到该分支会让这一步失败）
      - name: 读取 Dependabot 元数据
        id: meta
        uses: dependabot/fetch-metadata@v3

      - name: 分析改动范围
        id: scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          DIRECTORY: ${{ steps.meta.outputs.directory }}
          DEPS: ${{ steps.meta.outputs.dependency-names }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
        run: |
          echo "ecosystem=$ECOSYSTEM directory=$DIRECTORY update=$UPDATE_TYPE"
          echo "deps=$DEPS"
          files=$(gh pr diff "$PR_URL" --name-only)
          echo "$files"
          web=false; workflows=false
          if grep -q '^web/' <<<"$files"; then web=true; fi
          if grep -q '^\.github/workflows/' <<<"$files"; then workflows=true; fi
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "workflows=$workflows" >> "$GITHUB_OUTPUT"

      # ── web/ 的 npm 更新：构建通过才合并 ──
      - name: 检出 PR
        if: steps.scope.outputs.web == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        if: steps.scope.outputs.web == 'true'
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 校验前端（check + build）
        if: steps.scope.outputs.web == 'true'
        working-directory: web
        env:
          PACKAGES_JSON: fixtures/packages.json
        run: |
          npm ci
          npm run check
          npm run build

      # ── 合并 ──
      # 在 runner.temp（非 git 目录）里执行，避免 --delete-branch 去动本地检出
      - name: 合并 PR
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
          TOUCHES_WORKFLOWS: ${{ steps.scope.outputs.workflows }}
        run: |
          if gh pr merge --squash --delete-branch "$PR_URL"; then
            exit 0
          fi
          if [ "$TOUCHES_WORKFLOWS" = "true" ] && [ "$HAS_PAT" != "true" ]; then
            echo "::error::该 PR 修改了 .github/workflows/*，GITHUB_TOKEN 没有 workflows 权限无法合并。请在 Settings → Secrets → Dependabot 添加 DEPENDABOT_AUTOMERGE_TOKEN（含 Workflows 读写的 PAT），或手动合并。"
          fi
          exit 1

      - name: 重新部署 Pages
        if: steps.scope.outputs.web == 'true' && env.HAS_PAT != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run update-index.yml --repo "$GITHUB_REPOSITORY" --ref main
