name: Update PyPI Index

# 产物：site/simple/（PEP 503，pip 使用）+ site/packages.json + web/ 构建的 Astro 前端
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/scripts/generate_index.py"
      - ".github/workflows/update-index.yml"
  workflow_call:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - uses: actions/configure-pages@v6
        id: pages

      - name: 生成 PyPI 索引
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_DIR: site
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python .github/scripts/generate_index.py

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 构建前端
        working-directory: web
        env:
          PACKAGES_JSON: ../site/packages.json
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          npm ci
          npm run build
          cp -r dist/. ../site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

